<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recibida Marti Rec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Shrikhand&family=Gloock&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F6E4EA; --surface:#FFF7F9; --ink:#3A1E2B; --muted:#7A5867; --line:#EBCBD6;
  --accent:#C2386F; --accent-ink:#ffffff; --accent-soft:#F9DCE6;
  --g1:#E0679A; --g2:#F7A8C4; --g3:#C2386F; --g4:#FFC9B9;
  --bad:#a3213b; --bad-soft:#f6d3da;
  --f-display:"Gloock",Georgia,serif; --f-body:"Fredoka",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body::before,body::after{content:"";position:fixed;inset:-12vh -12vw;z-index:-1;pointer-events:none;will-change:transform}
body::before{background:
  radial-gradient(55vw 45vh at 88% 14%,color-mix(in oklab,var(--g1) 28%,transparent),transparent 70%),
  radial-gradient(50vw 45vh at 78% 92%,color-mix(in oklab,var(--g3) 22%,transparent),transparent 70%);
  animation:bgDriftA 7s ease-in-out infinite alternate}
body::after{background:
  radial-gradient(45vw 55vh at 6% 55%,color-mix(in oklab,var(--g2) 34%,transparent),transparent 70%),
  radial-gradient(35vw 35vh at 34% 8%,color-mix(in oklab,var(--g4) 30%,transparent),transparent 70%);
  animation:bgDriftB 6s ease-in-out infinite alternate}
@keyframes bgDriftA{from{transform:translate(0,0) scale(1)}to{transform:translate(-7vw,6vh) scale(1.08)}}
@keyframes bgDriftB{from{transform:translate(0,0) scale(1.05)}to{transform:translate(8vw,-5vh) scale(.97)}}
@keyframes inUp{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.blobs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(48px);opacity:.55;will-change:transform}
.blobs i:nth-child(1){width:34vmax;height:34vmax;left:-8vmax;top:-6vmax;background:#F7A8C4;animation:b1 8s ease-in-out infinite alternate}
.blobs i:nth-child(2){width:26vmax;height:26vmax;right:-6vmax;top:20vh;background:#E0679A;opacity:.38;animation:b2 6.5s ease-in-out infinite alternate}
.blobs i:nth-child(3){width:30vmax;height:30vmax;left:30vw;bottom:-12vmax;background:#FFC9B9;animation:b3 7.5s ease-in-out infinite alternate}
.blobs i:nth-child(4){width:18vmax;height:18vmax;left:12vw;top:45vh;background:#C2386F;opacity:.25;animation:b4 5.5s ease-in-out infinite alternate}
.blobs i:nth-child(5){width:22vmax;height:22vmax;right:18vw;top:-8vmax;background:#F9C6DA;animation:b5 6s ease-in-out infinite alternate}
.blobs i:nth-child(6){width:16vmax;height:16vmax;right:4vw;bottom:6vh;background:#D9A2F0;opacity:.35;animation:b6 5s ease-in-out infinite alternate}
@keyframes b1{to{transform:translate(14vw,10vh) scale(1.15)}}
@keyframes b2{to{transform:translate(-16vw,14vh) scale(.85)}}
@keyframes b3{to{transform:translate(-12vw,-16vh) scale(1.2)}}
@keyframes b4{to{transform:translate(20vw,-12vh) scale(1.3)}}
@keyframes b5{to{transform:translate(-10vw,18vh) scale(1.1)}}
@keyframes b6{to{transform:translate(-18vw,-10vh) scale(1.25)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}

h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(2.4rem,8vw,3.6rem);line-height:1.02;color:var(--accent)}
h2{font-size:1.3rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:not-allowed}
input[type=text],input[type=password]{width:100%;min-width:0;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;animation:inUp .4s ease both}
.hint{font-size:.9rem;color:var(--muted);margin:0}
.err{font-size:.9rem;color:var(--bad);margin:0;font-weight:600}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.9rem}

/* Foto + estrellas */
.hero{display:block}
.photo{position:relative;width:clamp(200px,28vw,290px);aspect-ratio:640/814;justify-self:end}
.photo::before{content:"";position:absolute;inset:12% 6% 4%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in oklab,var(--g2) 70%,transparent),transparent);filter:blur(10px);z-index:0}
.photo img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;
  -webkit-mask-image:linear-gradient(to bottom,#000 76%,transparent 100%),linear-gradient(to right,transparent 0,#000 22%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,#000 76%,transparent 100%),linear-gradient(to right,transparent 0,#000 22%);mask-composite:intersect;
  filter:drop-shadow(0 8px 18px rgba(194,56,111,.25))}
.star{position:absolute;z-index:2;fill:#E0679A;width:22px;height:22px;transform-origin:center;scale:1.35;filter:drop-shadow(0 0 6px rgba(247,168,196,.9));animation:twinkle 2.4s ease-in-out infinite}
.star.s1{left:-6%;top:8%;width:30px;height:30px}
.star.s2{left:14%;top:-4%;width:18px;height:18px;fill:#F7A8C4;animation-delay:.4s}
.star.s3{left:48%;top:-9%;width:26px;height:26px;animation-delay:.9s}
.star.s4{right:10%;top:-2%;width:20px;height:20px;fill:#C2386F;animation-delay:1.3s}
.star.s5{right:-8%;top:16%;width:32px;height:32px;fill:#F28AB5;animation-delay:.2s}
.star.s6{right:-12%;top:42%;width:18px;height:18px;animation-delay:1.7s}
.star.s7{right:-6%;top:66%;width:26px;height:26px;fill:#F7A8C4;animation-delay:.6s}
.star.s8{right:8%;bottom:2%;width:18px;height:18px;fill:#C2386F;animation-delay:1.1s}
.star.s9{left:40%;bottom:-4%;width:24px;height:24px;animation-delay:1.9s}
.star.s10{left:2%;bottom:6%;width:20px;height:20px;fill:#F28AB5;animation-delay:.3s}
.star.s11{left:-12%;top:52%;width:26px;height:26px;fill:#F7A8C4;animation-delay:1.5s}
.star.s12{left:-4%;top:30%;width:14px;height:14px;fill:#C2386F;animation-delay:.8s}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0deg);opacity:1}50%{transform:scale(.7) rotate(25deg);opacity:.55}}
@media (max-width:600px){.hero{grid-template-columns:1fr;text-align:center}.photo{justify-self:center;width:min(230px,62vw);margin-top:6px}}
.count{display:inline-block;vertical-align:middle;margin-left:6px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-body);font-weight:600;font-size:.85rem;line-height:1;padding:5px 10px;border-radius:99px}
.wrap{gap:20px!important;padding-block:clamp(16px,3vw,32px) 48px!important}
.hero{gap:12px!important}
.photo{width:clamp(170px,20vw,230px)!important}
.panel{padding:16px}
.panel.closed{border-color:color-mix(in oklab,var(--accent) 45%,var(--line));background:color-mix(in oklab,var(--accent) 8%,var(--surface))}
.panel.closed h2{color:var(--accent)}
@media (max-width:600px){.photo{width:min(190px,52vw)!important;margin-top:18px!important}.hero{gap:4px!important}}
.bulk{border-top:1px solid var(--line);padding-top:10px}
.bulk summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:.92rem}
.bulk[open]>div{display:flex;flex-direction:column;gap:10px;margin-top:10px}
/* App */
.wrap{max-width:1100px;margin:0 auto;padding-block:clamp(28px,5vw,52px) 64px;
  padding-left:max(clamp(16px,4vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,48px),env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
header>div:first-child{min-width:0}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.stat b{font-family:"Shrikhand",var(--f-display);font-size:clamp(1.9rem,6vw,2.5rem);font-weight:400;line-height:1.05;color:var(--accent)}
.stat span{font-size:.95rem;color:var(--muted)}
.cols{display:flex;flex-direction:column;gap:28px}
@media (min-width:860px){.cols{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);align-items:start}}
.addform{display:flex;flex-direction:column;gap:10px}
.addform .row{display:flex;gap:8px}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid color-mix(in oklab,var(--accent) 30%,var(--line));
  background:color-mix(in oklab,var(--accent) 6%,var(--surface));border-left:4px solid var(--accent);border-radius:8px;min-width:0;animation:inUp .3s ease both}
.list .n{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);min-width:2.2em;text-align:right}
.list .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.list .nm small{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);border-radius:6px;padding:4px 8px;font-size:.85rem;font-weight:600}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.del.sure{background:var(--bad);color:#fff}
.list li.empty{border-style:dashed;border-left-width:1px;background:none;color:var(--muted);justify-content:center}
.search{max-width:220px}
.status{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.9rem;z-index:10;max-width:90vw;text-align:center}
@media (max-width:600px){.listhead .search{max-width:none;flex:1 1 100%}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

<!-- APP -->
<div class="wrap" id="appView">
  <header class="hero">
    <div class="htext">
      <p class="eyebrow" style="margin:0 0 6px">Lista de invitados</p>
      <h1>Recibida Marti</h1>
    </div>
  </header>

  <div class="cols">
    <section class="panel closed">
      <h2>Lista cerrada</h2>
      <p class="hint">Ya no se puede anotar más gente. ¡Gracias a todos los que se sumaron!</p>
      <p class="status" id="syncStatus">Conectando…</p>
    </section>

    <section class="panel">
      <div class="listhead">
        <h2>La lista <span class="count" id="statCount">0</span></h2>
        <input type="text" class="search" id="searchIn" placeholder="Buscar…">
        <button class="btn primary" type="button" id="pdfBtn">Exportar a PDF</button>
      </div>
      <ul class="list" id="list"><li class="empty">Todavía no hay nadie anotado.</li></ul>
    </section>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
  // 👇 Pegá acá el link de la aplicación web de Apps Script (termina en /exec)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIjSquBezSqgfBWZuSMFUmpfmHb5sD8pQBeLmE5g-7hEfbnToACSiPa55ZNIPuF9XD/exec";

  const $ = id => document.getElementById(id);
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
  let items = [];          // {id,name,note,ts}
  // Limpia guiones/viñetas iniciales y pone mayúscula inicial a cada palabra
  const LOWER = new Set(["de","del","la","las","los","y","da","di","van","von"]);
  function cleanName(raw){
    let t = String(raw||"").replace(/^[\s\-–—−•·*_.,;:>]+/,"").replace(/\s+/g," ").trim();
    return t.toLocaleLowerCase("es").split(" ").map((w,i)=>{
      if(i>0 && LOWER.has(w)) return w;
      return w.replace(/(^|[-'’])(\p{L})/gu,(m,p,c)=>p+c.toLocaleUpperCase("es"));
    }).join(" ");
  }
  const CERRADA = true;
  let useLocal = false, readOnly = CERRADA, started = false;

  // ---------- toast ----------
  let tt; function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2600); }


  // ---------- data (Google Sheets) ----------
  const LIVE = /^https:\/\/script\.google\.com\//.test(SCRIPT_URL);
  function loadLocal(){ try{ items = JSON.parse(localStorage.getItem("rmList")||"[]").map(i=>({...i,name:cleanName(i.name)})); }catch(e){ items=[]; } render(); }
  function saveLocal(){ try{ localStorage.setItem("rmList", JSON.stringify(items)); }catch(e){} }
  let busy=false;
  async function api(payload){
    const r = payload
      ? await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
      : await fetch(SCRIPT_URL+"?t="+Date.now());
    const j = await r.json(); if(!j.ok) throw new Error(j.error||"error"); return j;
  }
  function setItems(list){ items=(list||[]).map(i=>({...i,name:cleanName(i.name)})).filter(i=>i.name).sort((a,b)=>a.ts-b.ts); render(); }
  async function refresh(){
    if(busy) return;
    try{ const j=await api(); if(!busy) setItems(j.items); $("syncStatus").textContent=(CERRADA?"Lista final":"Lista compartida · se actualiza sola cada 15 segundos."); }
    catch(e){ $("syncStatus").textContent="No se pudo conectar con la lista. Revisá tu conexión; se reintenta sola."; }
  }
  function startData(){
    if(!LIVE){ useLocal=true; loadLocal(); $("syncStatus").textContent="⚠ Falta pegar el link de la planilla (SCRIPT_URL): por ahora la lista se guarda sólo en este navegador."; return; }
    refresh(); setInterval(refresh,15000);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); });
  }

  async function addNames(list){
    list = list.map(it=>({...it,name:cleanName(it.name)})).filter(it=>it.name);
    if(useLocal){
      const existing=new Set(items.map(i=>norm(i.name))); let n=0; const dup=[];
      list.forEach((it,k)=>{ const key=norm(it.name); if(!key) return; if(existing.has(key)){dup.push(it.name);return;} existing.add(key);
        items.push({id:"l"+Date.now()+k, name:it.name.replace(/\s+/g," ").trim(), note:(it.note||"").trim(), ts:Date.now()+k}); n++; });
      saveLocal(); render(); return {n,dup};
    }
    busy=true;
    try{ const j=await api({action:"add",items:list}); setItems(j.items); return {n:j.added,dup:j.dup||[]}; }
    catch(e){ toast("No se pudo anotar. Probá de nuevo."); return {n:0,dup:[]}; }
    finally{ busy=false; }
  }


  // ---------- delete ----------
  let pending=null, pendT;
  $("list").addEventListener("click", async e=>{
    const b=e.target.closest(".del"); if(!b||readOnly) return;
    const id=b.dataset.id;
    if(pending!==id){ pending=id; render(); clearTimeout(pendT); pendT=setTimeout(()=>{pending=null;render();},3500); return; }
    pending=null;
    if(useLocal){ items=items.filter(i=>i.id!==id); saveLocal(); render(); return; }
    items=items.filter(i=>i.id!==id); render(); busy=true;
    try{ const j=await api({action:"delete",id}); setItems(j.items); }
    catch(err){ toast("No se pudo quitar."); }
    finally{ busy=false; }
  });

  // ---------- render ----------
  const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  $("searchIn").addEventListener("input", render);
  function render(){
    $("statCount").textContent = items.length;
    const q = norm($("searchIn").value);
    const ul=$("list");
    if(!items.length){ ul.innerHTML='<li class="empty">Todavía no hay nadie anotado.</li>'; return; }
    const rows = items.map((it,i)=>({it,i})).filter(({it})=>!q||norm(it.name+" "+(it.note||"")).includes(q));
    if(!rows.length){ ul.innerHTML='<li class="empty">No hay coincidencias.</li>'; return; }
    ul.innerHTML = rows.map(({it,i})=>`<li><span class="n">${i+1}</span><span class="nm">${esc(it.name)}${it.note?`<small>${esc(it.note)}</small>`:""}</span>${readOnly?"":`<button class="del${pending===it.id?" sure":""}" data-id="${esc(it.id)}" type="button">${pending===it.id?"¿Seguro?":"Quitar"}</button>`}</li>`).join("");
  }

  // ---------- PDF ----------
  function buildPdf(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:"mm",format:"a4"});
    const W=210, M=18; let y=0;
    const pink=[194,56,111], soft=[249,220,230], ink=[58,30,43], muted=[122,88,103];
    const header=(first)=>{
      doc.setFillColor(...soft); doc.rect(0,0,W,first?42:22,"F");
      doc.setTextColor(...pink); doc.setFont("helvetica","bold");
      if(first){ doc.setFontSize(26); doc.text("Recibida Marti",M,22);
        doc.setFontSize(11); doc.setFont("helvetica","normal"); doc.setTextColor(...muted);
        const f=new Date().toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"});
        doc.text(`Lista de invitados · ${items.length} anotado${items.length===1?"":"s"} · ${f}`,M,31); y=54; }
      else { doc.setFontSize(13); doc.text("Recibida Marti — lista (cont.)",M,14); y=32; }
    };
    header(true);
    items.forEach((it,i)=>{
      const h = it.note ? 11 : 8;
      if(y+h>282){ doc.addPage(); header(false); }
      if(i%2===0){ doc.setFillColor(255,244,248); doc.rect(M-3,y-5.5,W-2*M+6,h,"F"); }
      doc.setFont("courier","normal"); doc.setFontSize(10); doc.setTextColor(...muted);
      doc.text(String(i+1).padStart(3," ")+".",M,y);
      doc.setFont("helvetica","normal"); doc.setFontSize(12); doc.setTextColor(...ink);
      doc.text(doc.splitTextToSize(it.name,W-2*M-14)[0],M+12,y);
      if(it.note){ doc.setFontSize(9); doc.setTextColor(...muted); doc.text(doc.splitTextToSize(it.note,W-2*M-14)[0],M+12,y+4.2); }
      y+=h;
    });
    if(!items.length){ doc.setFontSize(12); doc.setTextColor(...muted); doc.text("Todavía no hay nadie anotado.",M,y); }
    const pages=doc.getNumberOfPages();
    for(let p=1;p<=pages;p++){ doc.setPage(p); doc.setFontSize(8); doc.setTextColor(...muted); doc.text(`${p} / ${pages}`,W-M,290,{align:"right"}); }
    return doc;
  }
  $("pdfBtn").onclick = async ()=>{
    if(!window.jspdf){ toast("No se pudo cargar el generador de PDF."); return; }
    const doc = buildPdf();
    try{ doc.save("Lista Recibida Marti.pdf"); }catch(e){ toast("No se pudo descargar el PDF."); }
  };
  // arrancar al final, cuando ya está todo definido
  startData();
})();
</script>
</body>
</html>
